default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]
default_stages: [pre-commit, pre-merge-commit]

repos:
  - repo: local
    hooks:
      - id: swiftformat
        name: swiftformat
        entry: swiftformat
        language: system
        types: [swift]

      - id: swiftlint
        name: swiftlint
        entry: swiftlint lint --strict --quiet
        language: system
        types: [swift]

      - id: swift-test
        name: swift test
        entry: swift test --package-path Packages/MuseManCore
        language: system
        files: ^Packages/MuseManCore/
        types: [swift]
        pass_filenames: false

      - id: xcodebuild
        name: build app for iOS
        entry: bash -c "set -o pipefail; xcodebuild -project muse-man.xcodeproj -scheme muse-man -destination 'platform=iOS Simulator,name=iPhone 17' SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build | xcbeautify --quiet"
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
