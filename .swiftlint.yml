excluded:
  - "**/.build"
  - DerivedData

disabled_rules:
  - trailing_comma

custom_rules:
  no_debug_logging:
    included: "Packages/MuseManCore/Sources/.*\\.swift"
    regex: "\\b(print|debugPrint|NSLog)\\("
    message: "Remove debug logging before committing"
    severity: error
  no_comments:
    excluded: "Package\\.swift$"
    regex: "(//|/\\*)"
    match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
    message: "Write code without comments unless asked"
    severity: error
