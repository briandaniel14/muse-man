name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install swiftlint swiftformat xcbeautify
      - name: Format
        run: swiftformat --lint .
      - name: Lint
        run: swiftlint lint --strict
      - name: Test
        run: swift test --package-path Packages/MuseManCore
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project muse-man.xcodeproj -scheme muse-man \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build | xcbeautify --quiet
